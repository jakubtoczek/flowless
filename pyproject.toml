[project]
name = "flowless"
dynamic = ["version"]
description = "Flowless — flow cytometry (FCS) fluorescence analysis: gates, overlay histograms, values, reports"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.6",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.scripts]
flowless = "flowless.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowless"]

[tool.hatch.version]
path = "src/flowless/__init__.py"
